name: process-emails

on:
  schedule:
    - cron: "*/20 * * * *"   # ~každých 20 min (GitHub spouští s mírným zpožděním)
  workflow_dispatch:

permissions:
  contents: write   # write kvůli keepalive

concurrency:
  group: process-emails
  cancel-in-progress: false   # dva běhy nad stejnou schránkou by dělaly duplicity

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Process trailcam emails
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IMAP_SERVER: ${{ vars.IMAP_SERVER || 'imap.seznam.cz' }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp.seznam.cz' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          TARGET_DRIVE_FOLDER_ID: ${{ secrets.TARGET_DRIVE_FOLDER_ID }}
          # Historie zpracovaných e-mailů leží na Drive, runner je ephemeral
          STATE_BACKEND: drive
          # 7 dní jako v dosavadním .env na PythonAnywhere; stahují se jen hlavičky,
          # takže delší okno je levné a lépe dohání případné výpadky
          EMAIL_LOOKBACK_DAYS: "7"
          # Repo je public => logy jsou veřejné. INFO nevypisuje subjecty ani ID.
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: python src/main.py

      - name: Keepalive (prevent cron disable)
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Dní od posledního commitu: $days"
          if [ "$days" -ge 50 ]; then
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
